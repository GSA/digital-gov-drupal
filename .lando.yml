name: digitalgov
config:
  via: 'nginx:1.25'
services:
  cache:
    # Lando has no Valkey service type; run Valkey (matching the Cloud.gov
    # ElastiCache engine) under the redis type so LANDO_INFO and
    # settings.lando.php still treat it as Redis. ElastiCache's 8.2 is an
    # AWS-only release; 8.1 is the closest upstream image.
    type: 'redis:7'
    overrides:
      image: 'valkey/valkey:8.1'
  node:
    type: 'node:24'
    build:
      - ./orch/build_node.sh
    scanner: false
    globals:
      gulp-cli: latest
  appserver_nginx:
    build_as_root:
      # See https://github.com/lando/drupal/issues/124
      - sed 's|daemon|www-data|g' -i /opt/bitnami/scripts/nginx-env.sh
tooling:
  be:
    service: appserver
    cmd: "env COMPOSER_DEV=1 ./orch/build.sh"
  fe:
    service: node
    cmd: "./orch/build_node.sh"

