name: Sync From Prod

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Space to overwrite with production's database and public files."
        type: choice
        options:
          - staging
          - dev
        required: true
      sync_database:
        description: "Replace the target's database with production's."
        type: boolean
        default: true
      sync_files:
        description: "Replace the target's public files with production's."
        type: boolean
        default: true
      backup_target_first:
        description: "Back up the target's database first, so Database Restore can undo the sync."
        type: boolean
        default: true
      regenerate_static:
        description: "Regenerate the target's static site afterwards."
        type: boolean
        default: true
      database_file_override:
        description: "Path on the prod backup bucket to a specific database dump. Defaults to latest.sql.gz."
        required: false
      storage_file_override:
        description: "Path on the prod backup bucket to a specific files archive. Defaults to storage/latest.tar.gz."
        required: false

## One sync per target at a time; a second run waits rather than interleaving.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync prod to ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      ## Read from: production's backup bucket, which daily-backup.yml fills.
      BACKUP_SPACE: prod
      ## Written to.
      CF_SPACE: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Check target
        env:
          INSTALL_DRUPAL_SPACES: "${{ vars.INSTALL_DRUPAL_SPACES }}"
        run: |
          ## The choice input already rules out prod; this keeps it that way if the
          ## options are ever edited.
          case "${CF_SPACE}" in
            dev | staging) ;;
            *)
              echo "Error: target must be dev or staging, not '${CF_SPACE}'."
              exit 1
              ;;
          esac

          ## A space listed here is reinstalled from default content on its next
          ## deploy, which would throw away everything this workflow copies in.
          IFS=',' read -ra SPACES <<< "${INSTALL_DRUPAL_SPACES}"
          for space in "${SPACES[@]}"; do
            if [[ "${space}" == "${CF_SPACE}" ]]; then
              echo "Error: '${CF_SPACE}' is in INSTALL_DRUPAL_SPACES, so its next deploy would reinstall it. Remove it from that variable first."
              exit 1
            fi
          done
      - name: Install basic dependencies
        run: ./scripts/pipeline/deb-basic-deps.sh
      - name: Install AWSCLI
        run: ./scripts/pipeline/deb-awscli.sh
      - name: Install MySQL Client
        if: inputs.sync_database
        run: ./scripts/pipeline/deb-mysql-client-install.sh
      - name: Install Cloudfoundry CLI
        run: ./scripts/pipeline/deb-cf-install.sh
      - name: Cloud.gov login
        env:
          CF_USER: "${{ secrets.CF_USER }}"
          CF_PASSWORD: "${{ secrets.CF_PASSWORD }}"
          CF_ORG: "${{ secrets.CF_ORG }}"
          PROJECT: "${{ secrets.PROJECT }}"
        run: source ./scripts/pipeline/cloud-gov-login.sh
      - name: Start Bastion
        if: inputs.sync_database
        env:
          PROJECT: "${{ secrets.PROJECT }}"
          DATABASE_BACKUP_BASTION_NAME: "${{ secrets.DATABASE_BACKUP_BASTION_NAME }}"
        run: |
          cf start "${PROJECT}-${DATABASE_BACKUP_BASTION_NAME}-${CF_SPACE}" >/dev/null 2>&1
          ./scripts/pipeline/cloud-gov-wait-for-app-start.sh "${PROJECT}-${DATABASE_BACKUP_BASTION_NAME}-${CF_SPACE}"
      - name: Back up target database
        if: inputs.sync_database && inputs.backup_target_first
        shell: bash
        env:
          PROJECT: "${{ secrets.PROJECT }}"
          DATABASE_BACKUP_BASTION_NAME: "${{ secrets.DATABASE_BACKUP_BASTION_NAME }}"
        run: |
          export TIMESTAMP=$(date --utc +%FT%TZ | tr ':', '-')
          source ./scripts/pipeline/database-backup.sh
      - name: Sync public files
        if: inputs.sync_files
        shell: bash
        env:
          PROJECT: "${{ secrets.PROJECT }}"
          FILES_BACKUP_TYPE: storage
          PUBLIC_FILES_ONLY: "1"
          S3_FILE_PATH: "${{ inputs.storage_file_override }}"
        run: source ./scripts/pipeline/files-restore.sh
      - name: Sync database
        if: inputs.sync_database
        shell: bash
        env:
          PROJECT: "${{ secrets.PROJECT }}"
          DATABASE_BACKUP_BASTION_NAME: "${{ secrets.DATABASE_BACKUP_BASTION_NAME }}"
          S3_FILE_PATH: "${{ inputs.database_file_override }}"
        run: |
          source ./scripts/pipeline/s3-backup-download.sh
          source ./scripts/pipeline/database-restore.sh
      - name: Post Sync
        if: inputs.sync_database || inputs.sync_files
        env:
          PROJECT: "${{ secrets.PROJECT }}"
        run: ./scripts/pipeline/cloud-gov-post-sync.sh
      - name: Regenerate Static Site
        if: inputs.regenerate_static
        env:
          PROJECT: "${{ secrets.PROJECT }}"
        run: source ./scripts/pipeline/pipeline_wrapper.sh upkeep
      - name: Stop Bastion
        if: always() && inputs.sync_database
        env:
          PROJECT: "${{ secrets.PROJECT }}"
          DATABASE_BACKUP_BASTION_NAME: "${{ secrets.DATABASE_BACKUP_BASTION_NAME }}"
        run: |
          ## A failed step can leave the CLI targeting the prod space.
          cf target -s "${CF_SPACE}" >/dev/null 2>&1
          cf stop "${PROJECT}-${DATABASE_BACKUP_BASTION_NAME}-${CF_SPACE}" >/dev/null 2>&1
